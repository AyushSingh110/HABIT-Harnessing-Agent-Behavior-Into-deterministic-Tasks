[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habit"
version = "0.0.0"
description = "A self-optimizing runtime for LLM agents."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "sqlalchemy>=2"]

[project.optional-dependencies]
langgraph = ["langgraph", "langchain-core"]
groq = ["groq"]
ollama = ["ollama"]
dev = ["pytest", "ruff", "mypy", "langgraph", "langchain-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/habit"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["groq.*", "ollama.*"]
ignore_missing_imports = true
